# SECRETS IN PLAIN TEXT – FOR A QUICK TEST / DEMO ONLY. Never commit real values, never use this file in production:
# there, create the same Secrets from your secret store (Vault, External Secrets, Sealed Secrets …) – see the table
# "Secrets" in docs/deployment. Names and keys must stay exactly as below.
#
# alerta-next-db            (required) database login: username, password. The bundled PostgreSQL (20-database.yaml)
#                           creates its superuser from it on first start; the backend logs in with it.
#                           Optional keys for an external database with a separate migration account:
#                           migration-username, migration-password.
# alerta-next-alertmanager  (optional) login to your Alertmanager's API, only if silences are enabled
#                           (10-config.yaml) and Alertmanager requires a login. Either
#                             token: <bearer token>
#                           or
#                             username: <user>
#                             password: <password>
#                           Empty = no login.
apiVersion: v1
kind: Secret
metadata:
  name: alerta-next-alertmanager
stringData: {}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: alerta-next-db
stringData:
  password: CHANGE-ME-database-password
  username: alerta
type: Opaque
