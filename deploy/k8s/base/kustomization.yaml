apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alerta-next
labels:
  - pairs:
      app.kubernetes.io/part-of: alerta-next
    includeSelectors: false
resources:
  - namespace.yaml
  - database.yaml
  - backend.yaml
  - frontend.yaml
  - availability.yaml
  - gateway.yaml
  - network-policies.yaml
  - mesh-security.yaml
configMapGenerator:
  - name: alerta-next-backend-config
    files:
      - config/application.yml
# Secrets alerta-next-db and alerta-next-registry are created outside of git (see deploy/k8s/README.md).
