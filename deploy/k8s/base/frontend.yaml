apiVersion: v1
kind: ServiceAccount
metadata:
  name: alerta-next-frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: alerta-next-frontend
  labels:
    app.kubernetes.io/name: alerta-next-frontend
spec:
  selector:
    app.kubernetes.io/name: alerta-next-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerta-next-frontend
  labels:
    app.kubernetes.io/name: alerta-next-frontend
spec:
  # Two replicas: a rollout, a node drain or a crashed pod never takes the console down (PodDisruptionBudget in
  # availability.yaml). A new pod must be ready before an old one goes.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alerta-next-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alerta-next-frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: alerta-next-frontend
      automountServiceAccountToken: false
      # On different nodes where possible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: alerta-next-frontend
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
        - name: alerta-next-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: cr.artbit.com.pl/mydocker/alerta-next-frontend
          lifecycle:
            # Let the Service and the gateway stop sending new requests before the process starts shutting down.
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              value: http://alerta-next-backend:8080
            # Proxies whose X-Forwarded-For is believed (ingress / gateway pods, load balancer), comma-separated CIDRs.
            # Empty = only the direct connection: safe, but every client shows as the proxy. Set it in the overlay.
            - name: TRUSTED_PROXIES
              value: ""
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            # The image entrypoint renders nginx config from templates at start-up; pid and temp files go to /tmp.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
