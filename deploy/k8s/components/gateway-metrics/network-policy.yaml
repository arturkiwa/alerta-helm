apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-metrics-scrape
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: alerta-next-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring # ← namespace of the Prometheus that scrapes
      ports:
        - { protocol: TCP, port: 15020 }
