# The backend talks to the provider (discovery, token endpoint, keys); browsers are redirected there directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-sso
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alerta-next-backend
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.20.30.40/32     # ← the provider's address (or its load balancer); several blocks if needed
      ports:
        - { protocol: TCP, port: 443 }
