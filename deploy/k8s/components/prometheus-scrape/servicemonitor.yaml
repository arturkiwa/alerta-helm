# Only for clusters with the Prometheus Operator (add to the component's resources when needed).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alerta-next-backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alerta-next-backend
      app.kubernetes.io/component: metrics
  endpoints:
    - port: http-metrics
      path: /actuator/prometheus
      interval: 30s
