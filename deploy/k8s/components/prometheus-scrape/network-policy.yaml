apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-metrics-scrape
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alerta-next-backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring # ← namespace of the Prometheus that scrapes
      ports:
        - { protocol: TCP, port: 8081 }
