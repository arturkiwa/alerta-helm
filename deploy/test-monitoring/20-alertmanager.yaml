apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    # Every alert goes to Alerta Next. The API key (Alerta Next → Administracja → Klucze API) lives in the Secret
    # alertmanager-alerta-token, key "token".
    route:
      receiver: alerta-next
      group_by: [alertname, cluster, environment]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        # Watchdog every 1–2 minutes (repeat is checked on group_interval ticks): Alerta Next measures its age (alerta_watchdog_age_seconds) to detect a broken chain.
        - matchers: [alertname="Watchdog"]
          receiver: alerta-next
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
    receivers:
      - name: alerta-next
        webhook_configs:
          - url: https://alerta.artbit.com.pl/api/v1/ingest/alertmanager
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/alerta/token
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels: { app.kubernetes.io/name: alertmanager }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: alertmanager }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alertmanager }
      annotations:
        prometheus.io/scrape: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alertmanager
          image: docker.io/prom/alertmanager:v0.34.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.external-url=https://alertmanager.artbit.com.pl
            - --cluster.listen-address=
            # Login (basic auth) for every endpoint: accounts in Secret alertmanager-web-config, managed with
            # ./alertmanager-auth.sh. Without that Secret the pod does not start – never open by accident.
            - --web.config.file=/etc/alertmanager/web/web.yml
          ports:
            - { name: http, containerPort: 9093 }
          # /-/ready and /-/healthy need the login too, so the probes only check the port.
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml }
            - { name: token, mountPath: /etc/alertmanager/alerta, readOnly: true }
            - { name: web, mountPath: /etc/alertmanager/web, readOnly: true }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: token
          secret: { secretName: alertmanager-alerta-token }
        - name: web
          secret: { secretName: alertmanager-web-config }
        - name: data
          persistentVolumeClaim: { claimName: alertmanager-data }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector: { app.kubernetes.io/name: alertmanager }
  ports:
    - { name: http, port: 9093, targetPort: http }
