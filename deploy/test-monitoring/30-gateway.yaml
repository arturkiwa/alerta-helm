# Own Istio gateway, exposed on fixed NodePorts like Alerta's. TLS ends on the external LB, which forwards
# prometheus.artbit.com.pl and alertmanager.artbit.com.pl as plain HTTP to <worker>:30090.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: monitoring-gateway
  namespace: monitoring
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-gateway-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    gateway.networking.k8s.io/gateway-name: monitoring-gateway
  ports:
    - { name: http, port: 80, targetPort: 80, nodePort: 30090 }
    - { name: status, port: 15021, targetPort: 15021, nodePort: 30091 } # LB health check: GET /healthz/ready
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs: [{ name: monitoring-gateway }]
  hostnames: [prometheus.artbit.com.pl]
  rules:
    - backendRefs: [{ name: prometheus, port: 9090 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs: [{ name: monitoring-gateway }]
  hostnames: [alertmanager.artbit.com.pl]
  rules:
    - backendRefs: [{ name: alertmanager, port: 9093 }]
