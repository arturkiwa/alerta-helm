apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
# Read-only discovery of pods/nodes and kubelet metrics (cAdvisor) through the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      # Labels Alerta Next uses to map alerts to its environments (Administracja → Środowiska → warunki).
      external_labels:
        cluster: testcluster
        environment: Test
    alerting:
      alertmanagers:
        - basic_auth:   # account "prometheus-testcluster" (./alertmanager-auth.sh add … monitoring/prometheus-alertmanager-auth)
            username: prometheus-testcluster
            password_file: /etc/prometheus/alertmanager/password
          static_configs:
            - targets: [alertmanager:9093]
    rule_files: [/etc/prometheus/rules/*.yml]
    scrape_configs:
      - job_name: prometheus
        basic_auth:
          username: admin
          password_file: /etc/prometheus/auth/password
        static_configs:
          - targets: [localhost:9090]
      - job_name: alertmanager
        basic_auth:
          username: prometheus-testcluster
          password_file: /etc/prometheus/alertmanager/password
        static_configs:
          - targets: [alertmanager:9093]

      # Host metrics of every node; instance = node name.
      - job_name: node-exporter
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [monitoring] } }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      - job_name: kube-state-metrics
        honor_labels: true
        static_configs:
          - targets: [kube-state-metrics:8080]

      # Container metrics of every node, via the API server proxy.
      - job_name: cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      # Kubelet itself (PVC usage, PLEG, pod start); only what the alerts use.
      - job_name: kubelet
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: kubelet_volume_stats_.*|kubelet_pleg_relist_duration_seconds_(bucket|count|sum)|kubelet_running_pods|kubelet_node_name|kubelet_certificate_manager_.*|process_start_time_seconds

      - job_name: apiserver
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs: [{ role: endpointslice, namespaces: { names: [default] } }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
            action: keep
            regex: kubernetes;https
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: apiserver_request_total|apiserver_client_certificate_expiration_seconds_(bucket|count)|etcd_request_duration_seconds_(bucket|count)|apiserver_storage_objects|apiserver_current_inflight_requests|process_start_time_seconds

      # Scheduler and controller manager (static pods on the control plane, HTTPS with token auth).
      - job_name: kube-control-plane
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true # self-signed serving certificates of kubeadm/kubespray
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [kube-system] } }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_component]
            action: keep
            regex: kube-scheduler|kube-controller-manager
          - source_labels: [__meta_kubernetes_pod_label_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_label_component, __meta_kubernetes_pod_ip]
            regex: kube-scheduler;(.+)
            target_label: __address__
            replacement: $1:10259
          - source_labels: [__meta_kubernetes_pod_label_component, __meta_kubernetes_pod_ip]
            regex: kube-controller-manager;(.+)
            target_label: __address__
            replacement: $1:10257
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: leader_election_master_status|process_start_time_seconds

      - job_name: coredns
        kubernetes_sd_configs: [{ role: endpointslice, namespaces: { names: [kube-system] } }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port]
            action: keep
            regex: coredns;9153
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: argocd
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [argocd] } }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_ip]
            regex: argocd-application-controller;(.+)
            target_label: __address__
            replacement: $1:8082
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: argocd-application-controller
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: argocd_app_info|argocd_app_sync_total|argocd_cluster_connection_status|argocd_app_reconcile_count|process_start_time_seconds

      # Any pod annotated prometheus.io/scrape: "true" (+ prometheus.io/port, prometheus.io/path):
      # Ceph, cert-manager, Istio, nodelocaldns, Cilium operator, …
      - job_name: kubernetes-pods
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: (.+);(\d+)
            target_label: __address__
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app.kubernetes.io/name: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.config.file=/etc/prometheus/auth/web.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.external-url=https://prometheus.artbit.com.pl
            - --web.enable-lifecycle
          ports:
            - { name: http, containerPort: 9090 }
          # Basic auth covers every HTTP path, so probes check the port only.
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
            - { name: auth, mountPath: /etc/prometheus/auth, readOnly: true }
            - { name: alertmanager-auth, mountPath: /etc/prometheus/alertmanager, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: auth
          secret: { secretName: prometheus-basic-auth }
        - name: alertmanager-auth   # password of the Alertmanager account prometheus-testcluster
          secret: { secretName: prometheus-alertmanager-auth }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: http }
