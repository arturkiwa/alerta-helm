{{- /* secrets.mode=csi with Vault: SecretProviderClasses for the Secrets Store CSI Driver. Every object becomes a file
       /etc/alerta/secrets/<NAME> in the pod; the backend reads them as settings (Spring configtree). */}}
{{- if and (include "alerta-next.csi" .) (not .Values.secrets.csi.secretProviderClass) }}
{{- $v := .Values.secrets.csi.vault }}
{{- $objects := $v.objects }}
{{- $allowed := list "DB_USER" "DB_PASSWORD" "DB_MIGRATION_USER" "DB_MIGRATION_PASSWORD" "ALERTMANAGER_TOKEN" "ALERTMANAGER_USERNAME" "ALERTMANAGER_PASSWORD" "OIDC_CLIENT_SECRET" "MAIL_PASSWORD" }}
{{- range .Values.alertmanagers }}
{{- $env := include "alerta-next.amEnv" .name }}
{{- $allowed = concat $allowed (list (printf "%s_TOKEN" $env) (printf "%s_USERNAME" $env) (printf "%s_PASSWORD" $env)) }}
{{- end }}
{{- range $name, $o := $objects }}
{{- if not (has $name $allowed) }}
{{- fail (printf "secrets.csi.vault.objects: unknown name %s (allowed: %s)" $name (join ", " $allowed)) }}
{{- end }}
{{- if not (and $o.path $o.key) }}
{{- fail (printf "secrets.csi.vault.objects.%s needs path and key" $name) }}
{{- end }}
{{- end }}
{{- range $required := list "DB_USER" "DB_PASSWORD" }}
{{- if not (hasKey $objects $required) }}
{{- fail (printf "secrets.csi.vault.objects.%s is required with secrets.mode=csi" $required) }}
{{- end }}
{{- end }}
{{- if and .Values.oidc.enabled (not (hasKey $objects "OIDC_CLIENT_SECRET")) }}
{{- fail "secrets.csi.vault.objects.OIDC_CLIENT_SECRET is required with oidc.enabled=true" }}
{{- end }}
{{- $classes := dict (include "alerta-next.spcBackend" .) (keys $objects | sortAlpha) }}
{{- if .Values.database.internal.enabled }}
{{- $_ := set $classes (include "alerta-next.spcDatabase" .) (list "DB_PASSWORD" "DB_USER") }}
{{- end }}
{{- range $spc, $names := $classes }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $spc }}
  labels:
    {{- include "alerta-next.labels" $ | nindent 4 }}
spec:
  provider: vault
  parameters:
    vaultAddress: {{ required "secrets.csi.vault.address is required with secrets.mode=csi" $v.address | quote }}
    roleName: {{ required "secrets.csi.vault.role is required with secrets.mode=csi" $v.role | quote }}
    vaultKubernetesMountPath: {{ default "kubernetes" $v.authPath | quote }}
    {{- with $v.namespace }}
    vaultNamespace: {{ . | quote }}
    {{- end }}
    objects: |
      {{- range $name := $names }}
      {{- $o := index $objects $name }}
      - objectName: {{ $name | quote }}
        secretPath: {{ $o.path | quote }}
        secretKey: {{ $o.key | quote }}
      {{- end }}
{{- end }}
{{- end }}
