# Local test Alertmanager, wired like a central one: every alert goes to Alerta Next's webhook.
# The API key (created in Alerta Next → Klucze API) is read from secrets/token – never committed.
route:
  receiver: alerta-next
  group_by: [alertname, cluster, environment]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
receivers:
  - name: alerta-next
    webhook_configs:
      - url: http://backend:8080/api/v1/ingest/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/token
