apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alerta-next.fullname" . }}-config
  labels:
    {{- include "alerta-next.labels" . | nindent 4 }}
data:
  application.yml: |
    # Generated by the Helm chart from values (alertmanager, oidc, internalCA, logs) with "config" merged over it.
    # Overrides the defaults built into the image. Change values and "helm upgrade" – the backend restarts by itself.
    {{- include "alerta-next.environmentYml" . | nindent 4 }}
