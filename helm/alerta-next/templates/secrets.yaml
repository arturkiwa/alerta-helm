{{- /* secrets.mode=values: Kubernetes Secrets from plain values in your values file – for demos and tests. */}}
{{- if eq (include "alerta-next.secretsMode" .) "values" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alerta-next.dbSecret" . }}
  labels:
    {{- include "alerta-next.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "database.username is required" .Values.database.username | quote }}
  password: {{ required "database.password is required with secrets.mode=values (or choose another secrets.mode)" .Values.database.password | quote }}
  {{- if or .Values.database.migrationUsername .Values.database.migrationPassword }}
  migration-username: {{ required "database.migrationUsername is required with migrationPassword" .Values.database.migrationUsername | quote }}
  migration-password: {{ required "database.migrationPassword is required with migrationUsername" .Values.database.migrationPassword | quote }}
  {{- end }}
{{- with include "alerta-next.alertmanagerSecret" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ . }}
  labels:
    {{- include "alerta-next.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- with $.Values.alertmanager.token }}
  token: {{ . | quote }}
  {{- end }}
  {{- with $.Values.alertmanager.username }}
  username: {{ . | quote }}
  password: {{ required "alertmanager.password is required with alertmanager.username" $.Values.alertmanager.password | quote }}
  {{- end }}
{{- end }}
{{- if and (eq (include "alerta-next.secretsMode" .) "values") .Values.mail.username }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alerta-next.mailSecret" . }}
  labels:
    {{- include "alerta-next.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "mail.password is required with mail.username" .Values.mail.password | quote }}
{{- end }}
{{- range .Values.alertmanagers }}
{{- $secret := include "alerta-next.namedAmSecret" (list $ .) }}
{{- if $secret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "alerta-next.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- with .token }}
  token: {{ . | quote }}
  {{- end }}
  {{- if .username }}
  username: {{ .username | quote }}
  password: {{ required (printf "alertmanagers %s: password is required with username" .name) .password | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- if .Values.oidc.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alerta-next.oidcSecret" . }}
  labels:
    {{- include "alerta-next.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ required "oidc.clientSecret is required with oidc.enabled=true and secrets.mode=values" .Values.oidc.clientSecret | quote }}
{{- end }}
{{- end }}
